/* animations */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}
header{animation:drop .6s cubic-bezier(.2,.8,.2,1) both}
.brand small{background:linear-gradient(100deg,#9db1ff 40%,#fff 50%,#9db1ff 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
#view.anim>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#view.anim .grid>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#view.anim .grid>*:nth-child(1){animation-delay:.05s}#view.anim .grid>*:nth-child(2){animation-delay:.1s}#view.anim .grid>*:nth-child(3){animation-delay:.15s}#view.anim .grid>*:nth-child(4){animation-delay:.2s}#view.anim .grid>*:nth-child(5){animation-delay:.25s}#view.anim .grid>*:nth-child(6){animation-delay:.3s}#view.anim .grid>*:nth-child(n+7){animation-delay:.35s}
.card,.stat,.btn,nav button,#tabbar button,.tag{transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease,opacity .2s ease,border-color .2s ease}
.grid>.card:hover,.stat:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(20,39,95,.18)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,39,95,.3)}

nav button:hover{opacity:1;background:rgba(255,255,255,.1)}
.sw,.grid img{transition:transform .35s ease}.grid>.card:hover .sw,.grid>.card:hover img{transform:scale(1.04)}
.hero img{animation:pop .7s .15s both}

/* animations 2 */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.hero{position:relative;overflow:hidden}

/* ===== ADIDAS-STYLE THEME ===== */
:root{--disp:"Inter","Helvetica Neue",Arial,sans-serif;--bg:#fff;--card:#fff;--ink:#000;--mut:#6b6b6b;--line:#dcdcdc;--acc:#000;--accT:#fff;--grad:#000;--sh:none;--r:0;--grey:#ecebe8}
body{background:#fff;color:#000;font-family:"Inter","Helvetica Neue",Arial,sans-serif;letter-spacing:0}

.card,.stat,.pa{border-radius:0;box-shadow:none;border:1px solid var(--line)}
.card:hover{transform:none}
.stat b{background:none;color:#000;-webkit-text-fill-color:#000;font-weight:900}
.btn{border-radius:0;background:#000;color:#fff;border:2px solid #000;text-transform:uppercase;font-weight:800;letter-spacing:.06em;font-size:13px;padding:13px 22px}

.lbl{color:#000;font-weight:800;letter-spacing:.1em}
.chip{border-radius:0;border:1px solid #000;font-weight:700;background:#fff;color:#000;padding:8px 14px;min-width:44px;justify-content:center}
.chip:hover{border-color:#000;box-shadow:inset 0 0 0 1px #000}
.chip.on{background:#000;color:#fff;border-color:#000}
.cats .chip{border:0;border-bottom:2px solid transparent;background:none;padding:6px 2px;margin-right:14px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;min-width:0}
.cats .chip.on{background:none;color:#000;border-bottom-color:#000}
.hx{border-radius:0;background:#000;color:#fff;padding:48px 36px;min-height:300px;margin:0 -20px 28px;align-items:flex-end;justify-content:space-between}
.hx img{border-radius:0;height:120px;padding:0;background:#fff;order:2}
.hx h1{font-size:clamp(34px,7vw,72px);line-height:.92;font-weight:900;letter-spacing:-.02em;margin:0 0 14px;max-width:640px}
.hx p{opacity:1;font-size:15px;font-weight:500;max-width:420px;margin:0 0 22px}
.hx .btn{background:#fff;color:#000;border-color:#fff}
.hx .btn:hover{background:#000;color:#fff;border-color:#fff}
.hero::after{display:none}
.pc{border:0;background:#fff}
.pc:hover{box-shadow:none;transform:none}
.pc .sw{height:300px;background-color:var(--grey);color:#000;font:800 12px var(--disp);letter-spacing:.12em;text-transform:uppercase;animation:none;transition:filter .2s}
.pc:hover .sw{filter:brightness(.96)}
.pc .bd{padding:12px 2px 18px;gap:10px}
.pc h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.pc .pr{background:none;-webkit-text-fill-color:#000;color:#000;font:600 15px var(--disp)}
.grid{gap:28px 18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.sw{animation:none}
.pm{border-radius:0;border-color:#000}
.pm:has(input:checked){box-shadow:0 0 0 2px #000 inset}
.pm input{accent-color:#000}
.mut{color:var(--mut)}
th{color:#000;text-transform:uppercase;font-size:11px;letter-spacing:.08em;font-weight:800}
table tr:hover td{background:#f5f5f5}
#toast{background:#000;border-radius:0;font-weight:600}
footer{max-width:none;background:#000;color:#fff;padding:36px 28px 40px;margin-top:40px;font-size:13px}
footer a,footer .mut{color:#bbb}
footer .btn.alt{background:none;color:#fff;border-color:#fff}
footer .ico{border:0}
main{padding-top:24px}
.mode{margin-bottom:20px}
/* auth screens */
.auth{max-width:420px;margin:36px auto;border:0;padding:0}
.auth h2{font-size:34px;line-height:1;margin-bottom:10px;letter-spacing:-.02em}
.auth p{margin:0 0 22px}
.fld{display:block;margin-bottom:14px;position:relative}

.fld input{width:100%;height:50px}
.fld .tg{position:absolute;right:0;bottom:0;height:50px;padding:0 14px;background:none;border:0;font-weight:800;font-size:11px;letter-spacing:.08em;cursor:pointer;text-transform:uppercase}
.auth .btn{width:100%;height:52px}
.lnk{background:none;border:0;padding:0;font-weight:700;font-size:14px;text-decoration:underline;cursor:pointer;color:#000}

.recbox{font:800 22px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;background:var(--grey);padding:18px;text-align:center;margin:12px 0;word-break:break-all;user-select:all}

/* ===== PREMIUM MOTION ===== */
@keyframes p-up{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes p-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes p-word{from{transform:translateY(112%) rotate(3deg)}to{transform:none}}
@keyframes p-img{from{opacity:0;transform:scale(.86) translateY(34px)}to{opacity:1;transform:none}}
@keyframes p-fl{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes p-mq{to{transform:translateX(-50%)}}
@keyframes p-sheen{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes p-rp{to{transform:scale(1);opacity:0}}
@keyframes p-toast{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes p-shake{0%,100%{transform:none}15%{transform:translateX(-10px)}35%{transform:translateX(9px)}55%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
@keyframes p-spl{from{opacity:0;transform:translateY(26px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes p-ln{from{width:0}to{width:120px}}
@keyframes p-curtain{from{transform:none}to{transform:translateY(-100%);visibility:hidden}}
/* splash curtain */
#splash{position:fixed;inset:0;z-index:9999;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;animation:p-curtain .8s cubic-bezier(.76,0,.24,1) 1.15s forwards}
#splash>div{display:flex;flex-direction:column;align-items:center;gap:14px}
#splash b{font:400 clamp(26px,7vw,46px) "Michroma","Inter",sans-serif;letter-spacing:.34em;margin-right:-.34em;animation:p-spl 1.1s cubic-bezier(.16,1,.3,1) both}
#splash small{font-size:11px;font-weight:700;letter-spacing:.7em;margin-right:-.7em;animation:p-spl 1.1s .18s cubic-bezier(.16,1,.3,1) both}
#splash::after{content:"";position:absolute;left:50%;top:calc(50% + 54px);height:2px;background:#fff;transform:translateX(-50%);animation:p-ln .9s .35s cubic-bezier(.16,1,.3,1) both}
/* scroll progress (inverts over black/white) */
#prog{position:fixed;top:0;left:0;right:0;height:3px;background:#fff;mix-blend-mode:difference;transform-origin:0 0;transform:scaleX(0);z-index:100;pointer-events:none}
/* announcement ticker */
#annc{overflow:hidden;white-space:nowrap;padding:0}
#annc .track{display:inline-flex;padding:9px 0;animation:p-mq 44s linear infinite}
#annc:hover .track{animation-play-state:paused}
#annc .track span{display:inline-flex;align-items:center}
#annc .track span::after{content:"\2022";margin:0 28px;opacity:.5}
/* header hides on scroll down, returns on scroll up */
header{transition:transform .55s cubic-bezier(.16,1,.3,1)}
header.hide{transform:translateY(-100%)}
/* nav underline that slides in */
nav button,nav button:hover,nav button.on{box-shadow:none;background:linear-gradient(#000,#000) no-repeat 0 100%/0 3px;transition:background-size .45s cubic-bezier(.16,1,.3,1)}
nav button:hover,nav button.on{background-size:100% 3px}
#tabbar button{transition:background .3s,color .3s}
/* buttons */
.btn{position:relative;overflow:hidden;transition:background .25s,color .25s,border-color .25s,transform .15s,translate .3s cubic-bezier(.16,1,.3,1)}
.btn:active{transform:scale(.97)}
.btn.add:not(.alt):not(.sm):hover::after,.btn.arr:not(.alt):not(.sm):hover::after{content:"\2192"}
.btn .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:p-rp .65s ease-out forwards;pointer-events:none}
.btn.alt .rp,.hx .btn .rp{background:rgba(0,0,0,.16)}
.chip{transition:background .2s,color .2s,box-shadow .2s,transform .15s}
.chip:active{transform:scale(.92)}
/* hero */
.hx>*{position:relative;z-index:1}
.hx::before{content:"LEUCO JUBATUS \2014 LEUCO JUBATUS \2014 LEUCO JUBATUS \2014 LEUCO JUBATUS \2014 ";position:absolute;left:0;bottom:-.12em;white-space:nowrap;font:900 clamp(90px,19vw,230px)/1 "Inter",sans-serif;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.13);animation:p-mq 36s linear infinite;pointer-events:none;z-index:0;width:max-content}
.hx img{top:var(--py,0px);animation:p-fl 6s ease-in-out infinite}
.hx h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em;margin-bottom:-.1em}
.hx h1 .w>span{display:inline-block}
.enter .hx h1 .w>span{animation:p-word 1.1s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*.1s + .1s)}
.enter .hx p{animation:p-rise .9s .55s cubic-bezier(.16,1,.3,1) both}
.enter .hx .btn{animation:p-rise .9s .7s cubic-bezier(.16,1,.3,1) both}
.enter .hx img{animation:p-img 1.3s .25s cubic-bezier(.16,1,.3,1) both,p-fl 6s ease-in-out infinite}
/* entrance of pages and products */
.enter>.card:not(.sr){animation:p-up .8s cubic-bezier(.16,1,.3,1) both}
.enter .grid>.pc:not(.sr){animation:p-up .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--n,0)*.08s + .3s)}
.enter .cats{animation:p-rise .8s .2s cubic-bezier(.16,1,.3,1) both}
/* scroll reveal, slower and softer, staggered per column */
.sr:not(.in){opacity:0;transform:translateY(44px)}
.sr{transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.grid>.sr:nth-child(3n+2){transition-delay:.09s}.grid>.sr:nth-child(3n+3){transition-delay:.18s}
/* product cards: slow zoom, sheen, animated title underline */
.pc{position:relative}
.pc .sw{overflow:hidden;transition:transform 1.2s cubic-bezier(.16,1,.3,1),filter .3s}
.pc:hover .sw{transform:scale(1.07)}
.pc .sw::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.4) 50%,transparent 62%);transform:translateX(-120%);pointer-events:none}
.pc:hover .sw::after{animation:p-sheen 1.1s ease}
.pc .bd{position:relative;z-index:1;background:#fff}
.pc h3{align-self:flex-start;background:linear-gradient(#000,#000) no-repeat 0 100%/0 2px;padding-bottom:3px;transition:background-size .5s cubic-bezier(.16,1,.3,1)}
.pc:hover h3{background-size:100% 2px}
.fly{position:fixed;left:0;top:0;width:18px;height:18px;border-radius:50%;background:#000;box-shadow:0 0 0 3px #fff;z-index:9998;pointer-events:none}
/* toast + auth */
#toast{animation:p-toast .5s cubic-bezier(.16,1,.3,1)}
.auth{animation:p-rise .8s cubic-bezier(.16,1,.3,1) both}
.auth.shake{animation:p-shake .5s ease}
.fld input{transition:box-shadow .25s,border-color .25s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}#splash{display:none}}
.pc .sw{height:auto!important;aspect-ratio:4/5}

function billText(o){const sh=S.shop||{name:"LEUCO JUBATUS"},sub=o.sub??o.items.reduce((a,i)=>a+(i.price||0)*i.n,0);
 return sh.name+" - Invoice "+o.id+"\nDate: "+o.date+"\nCustomer: "+o.cust+"\n\n"+o.items.map(i=>i.name+" ("+i.s+"/"+i.c+") x"+i.n+" = "+rs((i.price||0)*i.n)).join("\n")+"\n\nSubtotal: "+rs(sub)+(o.disc?"\nDiscount: -"+rs(o.disc):"")+"\nShipping: "+rs(o.ship??S.ship)+"\nTotal: "+rs(o.total)+"\nPayment: "+o.method+" ("+o.payStatus+")\nThank you for shopping with "+sh.name+"."}

function waNum(x){let d=String(x||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="94"+d.slice(1);return d}
async function shareBill(id,how){const o=ord(id),t=billText(o);
 const copy=async()=>{try{await navigator.clipboard.writeText(t);toast("Bill copied. Paste it into any chat.")}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Bill copied. Paste it into any chat.")}catch(x){toast("Copy failed. Open the page in its own tab and try again.")}a.remove()}};
 if(how=="wa"){const w=window.open("https://wa.me/"+waNum(phoneOf(o))+"?text="+encodeURIComponent(t),"_blank");if(!w)copy();return}
 if(how=="native"&&navigator.share){try{await navigator.share({title:"Invoice "+id,text:t});return}catch(e){if(e.name=="AbortError")return}}
 copy()}
function resizeImg(f,cb,m0,fmt){if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const m=m0||500,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(fmt||"image/jpeg",0.72))};im.onerror=()=>toast("That file is not a picture. Choose a JPG or PNG.");im.src=rd.result};rd.readAsDataURL(f)}
function pickImg(el){resizeImg(el.files[0],d=>{pendImg=d;const e=document.getElementById("pprev");e.src=d;e.style.display="inline-block"})}

function makePdf(o){const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"}),sh=S.shop||{name:"LEUCO JUBATUS"};
 const sub=o.sub??o.items.reduce((a,i)=>a+(i.price||0)*i.n,0),ship=o.ship??S.ship,disc=o.disc||0,R=195,mon=n=>"Rs. "+Number(n).toLocaleString("en-US");
 let y=15;d.addImage(LOGO,"JPEG",15,y,30,33.8);
 d.setFontSize(10);d.setTextColor(90);let ty=y+10;[sh.addr,sh.phone,sh.email].filter(Boolean).forEach(t=>{d.text(String(t),50,ty);ty+=5});
 d.setFontSize(20);d.setTextColor(20);d.text("INVOICE",R,y+9,{align:"right"});
 d.setFontSize(10);d.setTextColor(90);d.text("No. "+o.id,R,y+16,{align:"right"});d.text(String(o.date),R,y+21,{align:"right"});
 y=58;d.setTextColor(20);d.setFont("helvetica","bold");d.text("Bill to:",15,y);d.setFont("helvetica","normal");d.text(String(o.cust),32,y);
 d.setTextColor(90);const ph=phoneOf(o),ad=d.splitTextToSize(String(o.addr||""),120);y+=5;if(ph){d.text(String(ph),32,y);y+=5}ad.forEach(t=>{d.text(t,32,y);y+=5});
 y+=5;d.setDrawColor(200);d.setTextColor(20);d.setFont("helvetica","bold");d.text("Item",15,y);d.text("Qty",125,y,{align:"right"});d.text("Price",160,y,{align:"right"});d.text("Amount",R,y,{align:"right"});d.line(15,y+2,R,y+2);d.setFont("helvetica","normal");y+=9;
 o.items.forEach(i=>{if(y>255){d.addPage();y=20}d.setTextColor(20);d.text(String(i.name),15,y);d.setTextColor(110);d.setFontSize(9);d.text(i.s+" / "+i.c,15,y+4.5);d.setFontSize(10);d.setTextColor(20);
  d.text(String(i.n),125,y,{align:"right"});d.text(mon(i.price||0),160,y,{align:"right"});d.text(mon((i.price||0)*i.n),R,y,{align:"right"});y+=11;d.line(15,y-5,R,y-5)});
 if(y>225){d.addPage();y=20}
 y+=2;const row=(l,v,b)=>{d.setFont("helvetica",b?"bold":"normal");d.setFontSize(b?13:10);d.text(l,150,y,{align:"right"});d.text(v,R,y,{align:"right"});y+=b?8:6};
 row("Subtotal",mon(sub));if(disc)row("Discount"+(o.code?" ("+o.code+")":""),"- "+mon(disc));row("Shipping",mon(ship));row("Total",mon(o.total),true);
 y+=6;d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(90);d.text("Payment: "+o.method+" ("+o.payStatus+")",15,y);y+=6;d.text("Thank you for shopping with "+sh.name+".",15,y);y+=8;
 const so=socList().map(([l,u])=>l+": "+socShort(u)).join("     ");if(so)d.text(so,15,y);
 return d}

async function billPdf(id,how){const o=ord(id);if(!window.jspdf)return toast("The PDF tool is still loading. Try again in a moment.");
 let blob;try{blob=makePdf(o).output("blob")}catch(e){return toast("Could not create the PDF. Try again.")}
 const fn=o.id+"-LEUCO-JUBATUS.pdf";
 if(how=="send"&&navigator.canShare){try{const f=new File([blob],fn,{type:"application/pdf"});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Invoice "+o.id,text:"Your invoice from "+((S.shop||{}).name||"LEUCO JUBATUS")});return}}catch(e){if(e&&e.name=="AbortError")return}}
 try{const dl=window.claude&&claude.use?await claude.use("downloads"):null;if(dl){await dl.save({filename:fn,data:blob});toast("Bill PDF saved");return}}catch(e){if(e&&e.code=="declined")return}
 toast("Could not save the PDF here. Open the page in its own browser tab and try again.")}

 pg.style.transform="scaleX("+(mx>0?Math.min(1,y/mx):0)+")";
 const dy=y-ly;if(h){if(y<=140)h.classList.remove("hide");else if(dy>6)h.classList.add("hide");else if(dy<-6)h.classList.remove("hide")}
 if(Math.abs(dy)>6)ly=y;
 const hx=document.querySelector(".hx");if(hx)hx.style.setProperty("--py",Math.min(y,700)*.16+"px")}
addEventListener("scroll",()=>{if(!tk){tk=true;requestAnimationFrame(()=>{tk=false;onScroll()})}},{passive:true});
/* count-up numbers on dashboards */
function countUp(){if(RM)return;document.querySelectorAll("#view .stat b").forEach(b=>{const t=b.textContent.trim(),m=t.match(/^(Rs\.\s*)?(\d[\d,]*)$/);if(!m)return;const end=+m[2].replace(/,/g,""),pre=m[1]||"";if(!end||end>1e9)return;const t0=performance.now(),D=1100;
 (function f(n){const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,4);if(p<1){b.textContent=pre+Math.round(end*e).toLocaleString();requestAnimationFrame(f)}else b.textContent=t})(t0)})}
/* page entrance */
function play(){const v=V0();if(!v)return;v.classList.remove("enter");void v.offsetWidth;v.classList.add("enter");clearTimeout(play.t);play.t=setTimeout(()=>v.classList.remove("enter"),2600);if(mode=="admin")countUp()}
let k2="";const r4=render;
render=function(){r4();const v=V0();
 const h=v.querySelector(".hx h1");if(h&&!h.querySelector(".w")){let i=0;h.innerHTML=h.textContent.trim().split(/\s+/).map(w=>'<span class="w"><span style="--i:'+(i++)+'">'+esc(w)+"</span></span>").join(" ")}
 v.querySelectorAll(".grid>.pc").forEach((e,i)=>e.style.setProperty("--n",i));
 const k=mode+"|"+tab+"|"+(authed?1:0)+"|"+(typeof fp!=="undefined"&&fp?1:0);
 if(k!=k2){k2=k;if(!splashing)play()}onScroll()};
/* add to cart: dot flies to the cart */
const _add=add;
add=function(id){const ev=window.event,btn=ev&&ev.target&&ev.target.closest?ev.target.closest(".btn"):null,r=btn?btn.getBoundingClientRect():null,q0=cart.reduce((a,c)=>a+c.n,0);
 _add(id);if(!r||RM||cart.reduce((a,c)=>a+c.n,0)<=q0)return;
 const t=[...document.querySelectorAll('#tabbar button[onclick*="cart"],#nav button[onclick*="cart"]')].map(b=>b.getBoundingClientRect()).find(b=>b.width>0);if(!t)return;
 const d=document.createElement("div");d.className="fly";document.body.appendChild(d);
 const sx=r.left+r.width/2-9,sy=r.top+r.height/2-9,ex=t.left+t.width/2-9,ey=t.top+t.height/2-9;
 const a=d.animate([{transform:`translate(${sx}px,${sy}px) scale(1)`,opacity:1},{transform:`translate(${(sx+ex)/2}px,${Math.min(sy,ey)-90}px) scale(1.2)`,opacity:1,offset:.5},{transform:`translate(${ex}px,${ey}px) scale(.3)`,opacity:.25}],{duration:800,easing:"cubic-bezier(.5,0,.3,1)"});
 a.onfinish=()=>d.remove()};
/* button ripple + magnetic hero button */
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest(".btn");if(!b||b.disabled)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,x=document.createElement("span");x.className="rp";x.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(x);setTimeout(()=>x.remove(),700)});
let mg=null;
document.addEventListener("pointermove",e=>{if(e.pointerType!="mouse")return;const b=e.target.closest&&e.target.closest(".hx .btn");if(mg&&mg!==b){mg.style.translate="";mg=null}if(b){const r=b.getBoundingClientRect();b.style.translate=(e.clientX-r.left-r.width/2)*.14+"px "+(e.clientY-r.top-r.height/2)*.3+"px";mg=b}});
/* toast slide-in each time, shake login card on wrong password */
const _toast=toast;
toast=function(t){_toast(t);const e=document.getElementById("toast");e.style.animation="none";void e.offsetWidth;e.style.animation="";
 if(/^(Wrong|Too many|Locked)/.test(t)){const a=document.querySelector(".auth");if(a){a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake")}}};
})();
applyView();render();
</script></body></html>
